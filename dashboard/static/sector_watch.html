<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sector Watch</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#050d18;color:#c8d6e5;font-family:'IBM Plex Mono',monospace;padding:16px}
    #header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
    .title{font-size:14px;color:#4a6580;letter-spacing:2px}
    .subtitle{font-size:10px;color:#2a4a60;letter-spacing:1px;margin-top:2px}
    .legend{background:#0d1117;border:1px solid #1a2d3d;border-radius:4px;padding:8px 14px;display:flex;gap:18px;font-size:9px;letter-spacing:1px;color:#4a6580;flex-wrap:wrap}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-bottom:14px}
    .card{background:#090f1a;border:1px solid #1a2d3d;border-radius:4px;padding:12px;cursor:pointer;transition:transform .15s,border-color .2s}
    .card:hover{transform:translateY(-2px)}
    .card.expanded{grid-column:1 / -1}
    .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
    .card-name{font-size:11px;color:#c8d6e5;font-weight:500;letter-spacing:.5px;line-height:1.3}
    .card-etf{font-size:18px;font-weight:700;color:#e8f4f8;letter-spacing:1px;margin-top:2px}
    .card-change{font-size:18px;font-weight:700;text-align:right;white-space:nowrap}
    .card-toggle{font-size:9px;color:#4a6580;margin-top:8px;text-align:right}
    .holdings{margin-top:10px;padding-top:10px;border-top:1px solid #1a2d3d;display:none}
    .holdings.show{display:block}
    .h-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:10px;border-bottom:1px solid #0f1a26}
    .h-row:last-child{border-bottom:none}
    .h-sym{color:#c8d6e5;font-weight:600;letter-spacing:.5px}
    .h-price{color:#7a8a9a;font-family:'IBM Plex Mono',monospace}
    .h-chg{font-weight:600;width:60px;text-align:right;font-family:'IBM Plex Mono',monospace}
    .h-vol{color:#4a6580;font-size:8px;width:50px;text-align:right;font-family:'IBM Plex Mono',monospace}
    #timer{position:fixed;bottom:12px;right:14px;background:#0d1117;border:1px solid #1a2d3d;border-radius:4px;padding:6px 12px;font-size:9px;color:#4a6580;letter-spacing:1px;z-index:10}
    .up{color:#00c087} .down{color:#ff4757} .flat{color:#6a8a9a}
    .err{color:#f59e0b;padding:14px;text-align:center}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .loading{animation:pulse 1.5s infinite;color:#4a6580;text-align:center;padding:20px}
  </style>
</head>
<body>
  <div id="header">
    <div>
      <div class="title">SECTOR ROTATION</div>
      <div class="subtitle">12 SPDR SECTORS · LIVE · CLICK TO EXPAND HOLDINGS</div>
    </div>
    <div class="legend">
      <span><span class="up">■</span> RISING</span>
      <span><span class="flat">■</span> FLAT</span>
      <span><span class="down">■</span> FALLING</span>
    </div>
  </div>
  <div id="grid" class="grid"><div class="loading">LOADING SECTOR DATA...</div></div>
  <div id="timer">REFRESH IN <span id="cd">60</span>s</div>

<script>
(function(){
  const expanded = new Set();

  function fmt(n, d=2, sign=false){
    if(n==null || isNaN(n)) return '—';
    const v = Number(n);
    const s = Math.abs(v).toFixed(d);
    return sign ? (v >= 0 ? '+' + s : '-' + s) : s;
  }
  function fmtV(v){
    if(!v || isNaN(v)) return '—';
    if(v >= 1e9) return (v/1e9).toFixed(1) + 'B';
    if(v >= 1e6) return (v/1e6).toFixed(1) + 'M';
    if(v >= 1e3) return (v/1e3).toFixed(0) + 'K';
    return String(Math.round(v));
  }
  function colorFor(pct){
    if(pct == null || isNaN(pct)) return '#6a8a9a';
    if(pct >= 0.5) return '#00c087';
    if(pct >= 0.05) return '#2ed573';
    if(pct <= -0.5) return '#ff4757';
    if(pct <= -0.05) return '#ff6b6b';
    return '#6a8a9a';
  }

  function render(sectors){
    if(!sectors || !sectors.length){
      document.getElementById('grid').innerHTML =
        '<div class="err">⚠ No sector data returned by /api/sectors/heatmap</div>';
      return;
    }
    const sorted = [...sectors].sort((a,b) => (b.change_pct||0) - (a.change_pct||0));
    document.getElementById('grid').innerHTML = sorted.map(s => {
      const etf = s.etf || '—';
      const name = s.sector || etf;
      const chg = s.change_pct;
      const c = colorFor(chg);
      const isOpen = expanded.has(etf);
      const holdings = (s.holdings || []).map(h => {
        const hc = colorFor(h.change_pct);
        return '<div class="h-row">' +
               '<span class="h-sym">' + h.symbol + '</span>' +
               '<span class="h-price">$' + fmt(h.price, 2) + '</span>' +
               '<span class="h-chg" style="color:' + hc + '">' + fmt(h.change_pct, 2, true) + '%</span>' +
               '<span class="h-vol">' + fmtV(h.volume) + '</span>' +
               '</div>';
      }).join('');
      return '<div class="card' + (isOpen ? ' expanded' : '') + '" data-etf="' + etf + '" style="border-color:' + c + '44">' +
             '<div class="card-top">' +
             '<div><div class="card-name">' + name + '</div><div class="card-etf">' + etf + '</div></div>' +
             '<div class="card-change" style="color:' + c + '">' + fmt(chg, 2, true) + '%</div>' +
             '</div>' +
             '<div class="card-toggle">' + (isOpen ? '▼ HIDE HOLDINGS' : '▶ ' + (s.holdings || []).length + ' HOLDINGS') + '</div>' +
             '<div class="holdings' + (isOpen ? ' show' : '') + '">' + holdings + '</div>' +
             '</div>';
    }).join('');
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => {
        const etf = card.getAttribute('data-etf');
        if(expanded.has(etf)) expanded.delete(etf); else expanded.add(etf);
        render(sectors);
      });
    });
  }

  let lastSectors = [];
  async function refresh(){
    try{
      const r = await fetch('/api/sectors/heatmap');
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      lastSectors = d.sectors || [];
      render(lastSectors);
    } catch(e) {
      document.getElementById('grid').innerHTML =
        '<div class="err">⚠ Failed to fetch sector data: ' + e.message + '</div>';
    }
  }

  let cd = 60;
  function tick(){
    cd--;
    const el = document.getElementById('cd');
    if(el) el.textContent = cd;
    if(cd <= 0){ cd = 60; refresh(); }
  }

  refresh();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
