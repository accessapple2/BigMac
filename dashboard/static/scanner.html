<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📡 Live Scanner — OllieTrades</title>
<script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root {
  --bg:     #0a0f1a;
  --card:   #111927;
  --btn:    #1e2940;
  --border: #1e2940;
  --hi:     #00ff88;
  --med:    #ffd700;
  --lo:     #f87171;
  --dim:    #64748b;
  --text:   #e2e8f0;
  --font:   'Courier New', Courier, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); }

/* ── HEADER ──────────────────────────────────────────────── */
#header {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 12px 20px; border-bottom: 1px solid #1e2940;
  background: linear-gradient(180deg, #0d1320 0%, var(--bg) 100%);
  flex-shrink: 0;
}
#hs-pulse {
  width: 12px; height: 12px; border-radius: 50%; background: var(--hi);
  animation: hsPulse 1.4s ease-in-out infinite; flex-shrink: 0;
}
#hs-pulse.paused { background: var(--med); animation: none; }
@keyframes hsPulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(0,255,136,.7); }
  50%      { box-shadow: 0 0 0 10px rgba(0,255,136,0); }
}
#hs-title { font-size: 20px; font-weight: 700; color: var(--hi); letter-spacing: 3px; text-transform: uppercase; flex: 1; }
#hs-time  { font-size: 13px; color: var(--dim); }
#hs-back  { font-size: 11px; color: var(--dim); text-decoration: none; padding: 5px 12px; border: 1px solid var(--border); border-radius: 5px; }
#hs-back:hover { color: var(--text); border-color: #2d4060; }

/* ── STATS BAR ───────────────────────────────────────────── */
#stats-bar {
  display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 20px;
  border-bottom: 1px solid #1e2940; flex-shrink: 0;
}
.hs-stat { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px 18px; text-align: center; min-width: 90px; }
.hs-stat-val { font-size: 26px; font-weight: 700; font-family: var(--font); }
.hs-stat-val.hi  { color: var(--hi); }
.hs-stat-val.med { color: var(--med); }
.hs-stat-val.dim { color: #94a3b8; }
.hs-stat-lbl { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

/* ── CONTROLS ────────────────────────────────────────────── */
#controls {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  padding: 10px 20px; border-bottom: 1px solid #1e2940; flex-shrink: 0;
}
.hs-btn {
  background: var(--btn); border: 1px solid #2d4060; color: #94a3b8;
  padding: 7px 16px; border-radius: 6px; cursor: pointer; font-size: 13px;
  font-family: var(--font); transition: all .15s; white-space: nowrap;
}
.hs-btn:hover { background: #2d4060; color: var(--text); }
.hs-btn.on    { background: rgba(0,255,136,.12); border-color: var(--hi); color: var(--hi); }
.hs-btn.pause { background: rgba(248,113,113,.12); border-color: var(--lo); color: var(--lo); }
.hs-btn.notif { background: rgba(0,255,136,.08); border-color: var(--hi); color: var(--hi); }
.hs-sel {
  background: var(--card); border: 1px solid var(--border); color: #94a3b8;
  padding: 7px 12px; border-radius: 6px; font-size: 13px; font-family: var(--font);
}
#hs-kbd-hint { margin-left: auto; font-size: 10px; color: #334155; }

/* ── FEED ────────────────────────────────────────────────── */
#feed-wrap {
  flex: 1; overflow-y: auto; padding: 14px 20px;
  display: flex; flex-direction: column; gap: 10px;
}
#feed-wrap::-webkit-scrollbar { width: 5px; }
#feed-wrap::-webkit-scrollbar-track { background: var(--bg); }
#feed-wrap::-webkit-scrollbar-thumb { background: #1e2940; border-radius: 3px; }

/* ── CARD (collapsed) ────────────────────────────────────── */
.hs-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px 18px;
  animation: hsSlide .35s ease-out; transition: box-shadow .45s, border-color .45s, background .15s;
  cursor: pointer;
  border-left: 3px solid transparent;
}
.hs-card:hover { background: #141f2e; transform: translateX(2px); }
.hs-card.glow-hi  { box-shadow: 0 0 22px rgba(0,255,136,.4); border-color: rgba(0,255,136,.4); }
.hs-card.glow-med { box-shadow: 0 0 14px rgba(255,215,0,.3);  border-color: rgba(255,215,0,.3); }
.hs-card.expanded {
  background: #0d1520;
  border-left: 3px solid var(--hi);
  border-color: rgba(0,255,136,.25);
}
@keyframes hsSlide { from { opacity:0; transform:translateX(-22px); } to { opacity:1; transform:translateX(0); } }

/* ── CARD HEADER ROW ─────────────────────────────────────── */
.hs-header-row {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.hs-badge { padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
.hs-badge.buy  { background: rgba(0,255,136,.15); color: var(--hi); border: 1px solid rgba(0,255,136,.3); }
.hs-badge.sell { background: rgba(248,113,113,.15); color: var(--lo); border: 1px solid rgba(248,113,113,.3); }
.hs-sym   { font-size: 24px; font-weight: 700; color: #f8fafc; min-width: 90px; }
.hs-price { font-size: 14px; color: var(--dim); min-width: 70px; }
.hs-conf  { font-size: 22px; font-weight: 700; min-width: 68px; text-align: right; }
.hs-conf.hi  { color: var(--hi); }
.hs-conf.med { color: var(--med); }
.hs-conf.lo  { color: var(--lo); }
.hs-pat   { padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; letter-spacing: .5px; background: #1e2940; color: #94a3b8; }
.hs-agent { font-size: 14px; color: #93c5fd; font-weight: 600; margin-left: auto; white-space: nowrap; }
.hs-ts    { font-size: 13px; color: #94a3b8; white-space: nowrap; }
.hs-expand-hint { font-size: 14px; color: #60a5fa; margin-left: 4px; }
.hs-card.expanded .hs-expand-hint { color: var(--hi); }
.hs-reason {
  flex-basis: 100%; margin-top: 6px; font-size: 12px; color: #cbd5e1;
  line-height: 1.5; font-style: italic;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.hs-card.expanded .hs-reason { display: none; }

/* ── EXPANDED DETAILS ────────────────────────────────────── */
.hs-details {
  display: none;
  padding-top: 14px;
  border-top: 1px solid #1e2940;
  margin-top: 12px;
  animation: detailsIn .25s ease-out;
}
@keyframes detailsIn {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.hs-card.expanded .hs-details { display: block; }

/* Row wrappers */
.det-row {
  display: flex; gap: 14px; margin-bottom: 12px; align-items: flex-start;
}

/* Mini chart */
.det-chart-wrap {
  width: 200px; height: 110px; background: #0c1220; border-radius: 6px;
  overflow: hidden; flex-shrink: 0; border: 1px solid #1e2940;
}
.det-chart-inner { width: 100%; height: 100%; }
.det-chart-loading {
  width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: #2d4060;
}

/* Technicals panel */
.det-technicals {
  display: flex; flex-direction: column; gap: 5px; font-size: 13px; padding-top: 4px;
}
.det-tech-item { color: #8b99b3; }
.det-tech-val  { color: #e0e6f0; font-weight: 500; }
.det-tech-val.green { color: var(--hi); }
.det-tech-val.red   { color: var(--lo); }

/* Levels row */
.det-levels {
  justify-content: space-between; background: #0c1220;
  padding: 12px 16px; border-radius: 8px; border: 1px solid #1e2940;
  flex-wrap: wrap; gap: 10px;
}
.det-level { text-align: center; min-width: 70px; }
.det-level-lbl   { display: block; font-size: 10px; color: #6b7a99; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
.det-level-price { font-size: 14px; font-weight: 600; color: #e0e6f0; }
.det-level-price.green { color: var(--hi); }
.det-level-price.red   { color: var(--lo); }
.det-level-price.gold  { color: var(--med); font-size: 16px; }

/* Reasoning */
.det-reasoning {
  background: #0c1220; padding: 12px; border-radius: 8px;
  border-left: 3px solid #6366f1; gap: 10px;
  align-items: flex-start;
}
.det-reason-icon { font-size: 18px; flex-shrink: 0; }
.det-reason-text { font-size: 12px; color: #94a3b8; line-height: 1.6; }

/* Position sizing */
.det-position {
  background: #0d1a2d; padding: 10px 14px; border-radius: 6px;
  border: 1px solid #1e3a5f; gap: 10px; align-items: center;
}
.det-pos-icon { font-size: 16px; flex-shrink: 0; }
.det-pos-text { font-size: 13px; color: #8b99b3; }
.det-pos-text strong { color: #38bdf8; }

/* Congress */
.det-congress {
  background: #1a1535; padding: 10px 12px; border-radius: 6px;
  border: 1px solid #2d2458; gap: 10px; align-items: flex-start;
  font-size: 12px; color: #a78bfa;
}
.det-congress-icon { font-size: 16px; flex-shrink: 0; }
.det-congress-text { line-height: 1.6; }

/* Action buttons */
.det-actions { gap: 10px; padding-top: 4px; flex-wrap: wrap; }
.det-btn {
  padding: 9px 18px; border-radius: 6px; font-size: 13px; font-weight: 600;
  cursor: pointer; border: none; transition: all .2s; font-family: var(--font);
  letter-spacing: .5px;
}
.det-btn.execute {
  background: linear-gradient(135deg, #00ff88, #00cc6a); color: #000;
}
.det-btn.execute:hover { transform: scale(1.04); box-shadow: 0 0 18px rgba(0,255,136,.45); }
.det-btn.watchlist {
  background: #1e2940; color: #e0e6f0; border: 1px solid #2d3a54;
}
.det-btn.watchlist:hover { background: #2d3a54; }
.det-btn.chart {
  background: #1e2940; color: #38bdf8; border: 1px solid #1e3a5f;
}
.det-btn.chart:hover { background: #1e3a5f; }

/* Empty state */
#hs-empty {
  text-align: center; color: #334155; padding: 80px 20px; font-size: 16px;
}
#hs-empty-icon { font-size: 56px; margin-bottom: 14px; }

/* ── LAYOUT ──────────────────────────────────────────────── */
#app { display: flex; flex-direction: column; height: 100vh; }

/* ── MOBILE ──────────────────────────────────────────────── */
@media (max-width: 600px) {
  .det-chart-wrap { width: 140px; height: 80px; }
  .det-levels { gap: 6px; }
  .det-level { min-width: 55px; }
  .det-btn { padding: 8px 14px; font-size: 12px; }
}

/* ── MOBILE 768px ────────────────────────────────────────── */
@media (max-width: 768px) {
  /* Prevent horizontal overflow */
  html, body { overflow-x: hidden !important; }

  /* Header — tighten up */
  #header { padding: 10px 14px; gap: 8px; }
  #hs-title { font-size: 16px; letter-spacing: 1px; }
  #hs-time { font-size: 11px; }
  #hs-back { font-size: 11px; padding: 6px 10px; min-height: 44px; display: flex; align-items: center; }

  /* Stats bar — allow wrap, shrink stats */
  #stats-bar { padding: 8px 12px; gap: 6px; }
  .hs-stat { min-width: 70px; padding: 6px 10px; flex: 1 1 auto; }
  .hs-stat-val { font-size: 20px; }
  .hs-stat-lbl { font-size: 9px; }

  /* Controls — stack vertically, full width */
  #controls { flex-direction: column; align-items: stretch; padding: 8px 12px; gap: 6px; }
  .hs-btn { min-height: 44px; font-size: 13px; text-align: center; justify-content: center; }
  .hs-sel { min-height: 44px; font-size: 16px; width: 100%; } /* 16px prevents iOS zoom */
  #hs-kbd-hint { display: none; } /* hide keyboard hint on touch */

  /* Feed */
  #feed-wrap { padding: 10px 12px; }

  /* Signal cards */
  .hs-card { padding: 12px 14px; }
  .hs-sym { font-size: 18px; }
  .hs-conf { font-size: 22px; }

  /* Expanded detail */
  .hs-detail { flex-direction: column; }
  .det-chart-wrap { width: 100%; height: 120px; }
  .det-levels { flex-wrap: wrap; gap: 6px; }
  .det-level { flex: 1 1 calc(50% - 6px); min-width: 0; }

  /* Action buttons */
  .det-btns { flex-direction: column; gap: 6px; }
  .det-btn { min-height: 44px; font-size: 14px; width: 100%; }

  /* Strategy pills — wrap to multiple lines */
  .hs-badges, .hs-pills { flex-wrap: wrap !important; gap: 4px !important; }

  /* Touch targets */
  button, .hs-btn { min-height: 44px; }
  img { max-width: 100%; height: auto; }
  input, select { font-size: 16px !important; }
}

/* ── LIGHT MODE ──────────────────────────────────────────── */
body.light-mode {
  --bg:     #f0f4f8;
  --card:   #ffffff;
  --btn:    #dde3ec;
  --border: #c8d0dc;
  --hi:     #0a7a3e;
  --med:    #9a6700;
  --lo:     #c0392b;
  --dim:    #5a6a82;
  --text:   #1a2030;
}
body.light-mode #header {
  background: linear-gradient(180deg, #e4eaf2 0%, var(--bg) 100%);
  border-color: var(--border);
}
body.light-mode #stats-bar,
body.light-mode #controls { border-color: var(--border); }
body.light-mode .hs-card:hover { background: #edf1f7; }
body.light-mode .hs-card.expanded { background: #f8faff; }
body.light-mode .det-chart-wrap,
body.light-mode .det-levels,
body.light-mode .det-reasoning { background: #e8eef6; border-color: var(--border); }
body.light-mode .det-position { background: #e0ecf8; border-color: #b0c8e0; }
body.light-mode .det-congress { background: #ede8fb; border-color: #c4b5f4; color: #5b3fa8; }
body.light-mode .det-btn.execute { box-shadow: none; }
body.light-mode .det-btn.watchlist,
body.light-mode .det-btn.chart { background: var(--btn); color: var(--text); border-color: var(--border); }
body.light-mode #hs-empty { color: #8899aa; }
body.light-mode #feed-wrap::-webkit-scrollbar-thumb { background: #c8d0dc; }
body.light-mode .hs-agent { color: #1e40af; }
body.light-mode .hs-ts { color: #334155; }
body.light-mode .hs-expand-hint { color: #1e40af; }
body.light-mode .hs-reason { color: #475569; }

/* ── COLORBLIND MODE (blue/orange replaces green/red) ─────── */
body.cb-mode {
  --hi: #4da6ff;   /* blue  — replaces green */
  --lo: #ff8c42;   /* orange — replaces red  */
}
body.cb-mode .hs-badge.buy  { background: rgba(77,166,255,.15); color: var(--hi); border-color: rgba(77,166,255,.3); }
body.cb-mode .hs-badge.sell { background: rgba(255,140,66,.15); color: var(--lo); border-color: rgba(255,140,66,.3); }
body.cb-mode .hs-card.glow-hi  { box-shadow: 0 0 22px rgba(77,166,255,.4); border-color: rgba(77,166,255,.4); }
body.cb-mode .hs-card.expanded { border-color: rgba(77,166,255,.25); }
body.cb-mode .det-btn.execute  { background: linear-gradient(135deg, #4da6ff, #1a7fd4); color: #fff; }
body.cb-mode .det-btn.execute:hover { box-shadow: 0 0 18px rgba(77,166,255,.45); }
body.cb-mode @keyframes hsPulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(77,166,255,.7); }
  50%      { box-shadow: 0 0 0 10px rgba(77,166,255,0); }
}
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div id="header">
    <div id="hs-pulse"></div>
    <div id="hs-title">📡 Live Scanner</div>
    <div id="hs-time">—</div>
    <a id="hs-back" href="/">← Dashboard</a>
  </div>

  <!-- STATS -->
  <div id="stats-bar">
    <div class="hs-stat"><div class="hs-stat-val hi"  id="stHigh">0</div><div class="hs-stat-lbl">High Conf ≥85%</div></div>
    <div class="hs-stat"><div class="hs-stat-val med" id="stMed">0</div><div class="hs-stat-lbl">Medium 70–84%</div></div>
    <div class="hs-stat"><div class="hs-stat-val dim" id="stToday">0</div><div class="hs-stat-lbl">Today Total</div></div>
    <div class="hs-stat"><div class="hs-stat-val dim" id="stFired">0</div><div class="hs-stat-lbl">Fired</div></div>
    <div class="hs-stat"><div class="hs-stat-val dim" id="stStatus">LIVE</div><div class="hs-stat-lbl">Status</div></div>
  </div>

  <!-- CONTROLS -->
  <div id="controls">
    <button class="hs-btn on"  id="btnSound"  onclick="hsToggleSound()">[S] 🔊 Sound ON</button>
    <button class="hs-btn"     id="btnPause"  onclick="hsTogglePause()">[P] ⏸ Pause</button>
    <select class="hs-sel"     id="selPat"    onchange="hsRerender()">
      <option value="">All Patterns</option>
      <option value="BREAKOUT">BREAKOUT</option>
      <option value="EMA PB">EMA PB</option>
      <option value="REL STR">REL STR</option>
      <option value="VOL SPIKE">VOL SPIKE</option>
      <option value="GREEN DAY">GREEN DAY</option>
      <option value="MOMENTUM">MOMENTUM</option>
      <option value="SIGNAL">SIGNAL</option>
    </select>
    <select class="hs-sel"     id="selAgent"  onchange="hsRerender()">
      <option value="">All Agents</option>
      <option value="Tractor Beam">Tractor Beam</option>
      <option value="Chekov">Chekov</option>
      <option value="Navigator">Navigator</option>
    </select>
    <button class="hs-btn"     id="btnNotif"  onclick="hsReqNotif()">[N] 🔔 Notifications</button>
    <button class="hs-btn"     id="btnClear"  onclick="hsClear()">🗑 Clear</button>
    <button class="hs-btn"     id="btnTheme"  onclick="hsToggleTheme()">[T] 🌙 Dark</button>
    <button class="hs-btn"     id="btnCB"     onclick="hsToggleCB()">[C] 👁 CB</button>
    <span id="hs-kbd-hint">Keyboard: S=sound  P=pause  F=filter  T=theme  C=colorblind  click=expand</span>
  </div>

  <!-- FEED -->
  <div id="feed-wrap">
    <div id="hs-empty">
      <div id="hs-empty-icon">📡</div>
      Scanning for signals…<br>
      <span style="font-size:12px;color:#1e3a5f;margin-top:8px;display:block">tractor-beam · chekov · navigator</span>
    </div>
  </div>

</div>

<script>
(function(){
  // ── State ─────────────────────────────────────────────────────────────────
  let lastId    = 0;
  let paused    = false;
  let sound     = true;
  let allSigs   = [];
  let stats     = { high:0, med:0, today:0, fired:0 };
  const aCtx    = window.AudioContext ? new AudioContext() : null;
  const chartCache = {};   // symbol → chart instance (to avoid duplicates)

  // ── Clock ─────────────────────────────────────────────────────────────────
  function tickClock() {
    const el = document.getElementById('hs-time');
    if (el) el.textContent = new Date().toLocaleTimeString('en-US', { hour12: false });
  }
  tickClock();
  setInterval(tickClock, 1000);

  // ── Boot ──────────────────────────────────────────────────────────────────
  hsFetch(true);
  setInterval(hsFetch, 5000);

  // ── Fetch ─────────────────────────────────────────────────────────────────
  async function hsFetch(initial = false) {
    if (paused && !initial) return;
    try {
      const url = `/api/scanner/live?limit=${initial ? 60 : 20}&since_id=${lastId}`;
      const r = await fetch(url);
      if (!r.ok) return;
      const data = await r.json();

      if (data.signals && data.signals.length > 0) {
        if (data.max_id > lastId) lastId = data.max_id;
        data.signals.forEach(s => hsIngest(s, !initial));
        hsUpdateStats();
        hsRerender();
      }
      document.getElementById('hs-pulse').classList.remove('paused');
      document.getElementById('stStatus').textContent = 'LIVE';
    } catch(e) {
      document.getElementById('stStatus').textContent = 'ERR';
    }
  }

  // ── Ingest ────────────────────────────────────────────────────────────────
  function hsIngest(sig, isNew) {
    if (allSigs.find(s => s.id === sig.id)) return;
    allSigs.unshift(sig);
    if (allSigs.length > 250) allSigs.pop();
    const isHigh = sig.confidence >= 85;
    const isMed  = sig.confidence >= 70 && sig.confidence < 85;
    if (isHigh) { stats.high++; if (isNew) { hsBeep('high'); hsNotify(sig); } }
    else if (isMed) { stats.med++; if (isNew) hsBeep('med'); }
    stats.today++;
  }

  // ── Re-render feed ────────────────────────────────────────────────────────
  window.hsRerender = function() {
    const feed  = document.getElementById('feed-wrap');
    const empty = document.getElementById('hs-empty');
    const pat   = document.getElementById('selPat').value;
    const agent = document.getElementById('selAgent').value;

    const visible = allSigs.filter(s =>
      (!pat   || s.pattern === pat) &&
      (!agent || s.agent   === agent)
    );

    feed.querySelectorAll('.hs-card').forEach(c => c.remove());
    if (empty) empty.style.display = visible.length ? 'none' : 'block';

    visible.slice(0, 100).forEach(sig => feed.appendChild(buildCard(sig)));
  };

  // ── Build card ────────────────────────────────────────────────────────────
  function buildCard(sig) {
    const isHigh  = sig.confidence >= 85;
    const isMed   = sig.confidence >= 70 && sig.confidence < 85;
    const confCls = isHigh ? 'hi' : isMed ? 'med' : 'lo';
    const glowCls = isHigh ? 'glow-hi' : isMed ? 'glow-med' : '';
    const ts      = (sig.timestamp || '').replace('T',' ').slice(0,16);
    const price   = sig.price > 0 ? sig.price : 0;
    const priceStr = price ? `$${price.toFixed(2)}` : '';

    const lvl = calcLevels(price, sig.confidence);
    const pos = price ? calcPosition(price, sig.confidence) : null;

    const d = document.createElement('div');
    d.className = `hs-card${glowCls ? ' '+glowCls : ''}`;
    d.dataset.symbol = sig.symbol;
    d.dataset.sigId  = sig.id;

    d.innerHTML = `
      <!-- Collapsed header -->
      <div class="hs-header-row">
        <span class="hs-badge buy">${sig.action}</span>
        <span class="hs-sym">${sig.symbol}</span>
        <span class="hs-price">${priceStr}</span>
        <span class="hs-conf ${confCls}">${sig.confidence}%</span>
        <span class="hs-pat">${sig.pattern}</span>
        <span class="hs-agent">→ ${sig.agent}</span>
        <span class="hs-ts">${ts}</span>
        <span class="hs-expand-hint">▼</span>
      </div>
      ${sig.reasoning ? `<div class="hs-reason">${sig.reasoning}</div>` : ''}

      <!-- Expanded details -->
      <div class="hs-details">

        <!-- Chart + Technicals -->
        <div class="det-row">
          <div class="det-chart-wrap">
            <div class="det-chart-inner" id="chart-${sig.id}">
              <div class="det-chart-loading">Loading…</div>
            </div>
          </div>
          <div class="det-technicals">
            <div class="det-tech-item">Conf: <span class="det-tech-val ${confCls}">${sig.confidence}%</span></div>
            <div class="det-tech-item">Agent: <span class="det-tech-val">${sig.agent}</span></div>
            <div class="det-tech-item">Pattern: <span class="det-tech-val">${sig.pattern}</span></div>
            ${price ? `<div class="det-tech-item">Price: <span class="det-tech-val">$${price.toFixed(2)}</span></div>` : ''}
            ${price ? `<div class="det-tech-item">R:R: <span class="det-tech-val gold">2:1</span></div>` : ''}
          </div>
        </div>

        <!-- Levels -->
        ${price ? `
        <div class="det-row det-levels">
          <div class="det-level">
            <span class="det-level-lbl">Entry</span>
            <span class="det-level-price">$${price.toFixed(2)}</span>
          </div>
          <div class="det-level">
            <span class="det-level-lbl">Stop</span>
            <span class="det-level-price red">$${lvl.stop} <small style="font-size:10px">(-${lvl.stopPct}%)</small></span>
          </div>
          <div class="det-level">
            <span class="det-level-lbl">Target</span>
            <span class="det-level-price green">$${lvl.target} <small style="font-size:10px">(+${lvl.targetPct}%)</small></span>
          </div>
          <div class="det-level">
            <span class="det-level-lbl">R:R</span>
            <span class="det-level-price gold">2:1</span>
          </div>
        </div>` : ''}

        <!-- Reasoning -->
        ${sig.reasoning ? `
        <div class="det-row det-reasoning">
          <div class="det-reason-icon">💡</div>
          <div class="det-reason-text">${sig.reasoning}</div>
        </div>` : ''}

        <!-- Position sizing -->
        ${pos ? `
        <div class="det-row det-position">
          <div class="det-pos-icon">📐</div>
          <div class="det-pos-text">Suggested: <strong>${pos.shares} shares ($${pos.value})</strong> @ ${pos.riskPct}% portfolio risk</div>
        </div>` : ''}

        <!-- Congress placeholder (loaded async) -->
        <div class="det-congress det-row" id="congress-${sig.id}" style="display:none">
          <div class="det-congress-icon">🏛️</div>
          <div class="det-congress-text"></div>
        </div>

        <!-- Action buttons -->
        <div class="det-row det-actions">
          ${price ? `<button class="det-btn execute" onclick="doExecute(event,'${sig.symbol}',${price})">⚡ Execute Now</button>` : ''}
          <button class="det-btn watchlist" onclick="doWatchlist(event,'${sig.symbol}')">👁 Watchlist</button>
          <button class="det-btn chart"     onclick="doChart(event,'${sig.symbol}')">📈 Full Chart</button>
        </div>

      </div>
    `;

    d.addEventListener('click', function(e) {
      // Don't toggle if a button was clicked inside
      if (e.target.closest('.det-btn')) return;
      toggleExpand(d, sig);
    });

    return d;
  }

  // ── Expand / collapse ─────────────────────────────────────────────────────
  function toggleExpand(card, sig) {
    const isExpanded = card.classList.contains('expanded');

    // Collapse any other open card
    document.querySelectorAll('.hs-card.expanded').forEach(c => {
      if (c !== card) {
        c.classList.remove('expanded');
        c.querySelector('.hs-expand-hint').textContent = '▼';
      }
    });

    if (isExpanded) {
      card.classList.remove('expanded');
      card.querySelector('.hs-expand-hint').textContent = '▼';
    } else {
      card.classList.add('expanded');
      card.querySelector('.hs-expand-hint').textContent = '▲';
      loadMiniChart(sig, card);
      loadCongressData(sig, card);
    }
  }

  // ── Mini chart ────────────────────────────────────────────────────────────
  async function loadMiniChart(sig, card) {
    const containerId = `chart-${sig.id}`;
    const container   = document.getElementById(containerId);
    if (!container || container.dataset.loaded) return;
    container.dataset.loaded = 'true';

    // Check LightweightCharts available
    if (typeof LightweightCharts === 'undefined') {
      container.innerHTML = '<div class="det-chart-loading" style="font-size:10px">Charts lib unavailable</div>';
      return;
    }

    try {
      const res  = await fetch(`/api/chart/${sig.symbol}?days=5`);
      const data = await res.json();

      if (!data.candles || data.candles.length === 0) {
        container.innerHTML = '<div class="det-chart-loading">No data</div>';
        return;
      }

      // Clear placeholder
      container.innerHTML = '';

      const chart = LightweightCharts.createChart(container, {
        width:  container.clientWidth  || 200,
        height: container.clientHeight || 110,
        layout: {
          background: { type: 'solid', color: '#0c1220' },
          textColor: '#475569',
        },
        grid: {
          vertLines: { visible: false },
          horzLines: { color: '#1a2540' },
        },
        rightPriceScale: { visible: false },
        leftPriceScale:  { visible: false },
        timeScale: { visible: false },
        crosshair: { mode: 0 },
        handleScroll: false,
        handleScale:  false,
      });

      const series = chart.addCandlestickSeries({
        upColor:        '#00ff88',
        downColor:      '#f87171',
        borderUpColor:  '#00ff88',
        borderDownColor:'#f87171',
        wickUpColor:    '#00ff88',
        wickDownColor:  '#f87171',
      });

      // LightweightCharts requires ascending time order, unique timestamps
      const candles = data.candles
        .sort((a, b) => a.time - b.time)
        .filter((c, i, arr) => i === 0 || c.time !== arr[i-1].time);

      series.setData(candles);
      chart.timeScale().fitContent();
      chartCache[sig.id] = chart;
    } catch(e) {
      container.innerHTML = '<div class="det-chart-loading" style="font-size:10px;color:#475569">Chart unavailable</div>';
    }
  }

  // ── Congress data ─────────────────────────────────────────────────────────
  async function loadCongressData(sig, card) {
    const panel = document.getElementById(`congress-${sig.id}`);
    if (!panel || panel.dataset.loaded) return;
    panel.dataset.loaded = 'true';

    try {
      const res  = await fetch(`/api/congress/trades`);
      const data = await res.json();
      const trades = (data.trades || data || []).filter(t =>
        (t.ticker || t.symbol || '').toUpperCase() === sig.symbol.toUpperCase()
      ).slice(0, 3);

      if (trades.length === 0) { panel.style.display = 'none'; return; }

      panel.querySelector('.det-congress-text').innerHTML =
        trades.map(t => `<div>${t.representative || t.name || '?'}: ${t.transaction_type || t.type || '?'} ${t.amount || ''} (${(t.transaction_date || t.date || '').slice(0,10)})</div>`).join('');
      panel.style.display = 'flex';
    } catch(e) {
      panel.style.display = 'none';
    }
  }

  // ── Calculations ──────────────────────────────────────────────────────────
  function calcLevels(price, confidence) {
    if (!price) return { stop:'—', stopPct:'—', target:'—', targetPct:'—' };
    const stopPct   = confidence >= 90 ? 0.03 : confidence >= 85 ? 0.05 : 0.07;
    const targetPct = stopPct * 2;
    return {
      stop:      (price * (1 - stopPct)).toFixed(2),
      stopPct:   (stopPct   * 100).toFixed(1),
      target:    (price * (1 + targetPct)).toFixed(2),
      targetPct: (targetPct * 100).toFixed(1),
    };
  }

  function calcPosition(price, confidence, portfolio = 100000) {
    if (!price) return null;
    const riskPct = confidence >= 90 ? 3 : confidence >= 85 ? 2 : 1.5;
    const val     = portfolio * (riskPct / 100);
    const shares  = Math.max(1, Math.floor(val / price));
    return { shares, value: (shares * price).toFixed(0), riskPct };
  }

  // ── Action buttons ────────────────────────────────────────────────────────
  window.doExecute = async function(event, symbol, price) {
    event.stopPropagation();
    if (!confirm(`Execute BUY order for ${symbol} @ $${price.toFixed(2)}?`)) return;
    try {
      const res  = await fetch('/api/trade/execute', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ symbol, side: 'BUY', price, source: 'scanner_manual' }),
      });
      const data = await res.json();
      if (data.success) {
        stats.fired++;
        hsUpdateStats();
        alert(`✅ Order submitted: BUY ${symbol}`);
      } else {
        alert(`❌ Order failed: ${data.error || 'unknown'}`);
      }
    } catch(e) {
      alert(`❌ Error: ${e.message}`);
    }
  };

  window.doWatchlist = function(event, symbol) {
    event.stopPropagation();
    const wl = JSON.parse(localStorage.getItem('watchlist') || '[]');
    if (!wl.includes(symbol)) {
      wl.push(symbol);
      localStorage.setItem('watchlist', JSON.stringify(wl));
      alert(`✅ ${symbol} added to watchlist`);
    } else {
      alert(`${symbol} already in watchlist`);
    }
  };

  window.doChart = function(event, symbol) {
    event.stopPropagation();
    window.open(`https://www.tradingview.com/chart/?symbol=${symbol}`, '_blank');
  };

  // ── Stats ─────────────────────────────────────────────────────────────────
  function hsUpdateStats() {
    document.getElementById('stHigh').textContent  = stats.high;
    document.getElementById('stMed').textContent   = stats.med;
    document.getElementById('stToday').textContent = stats.today;
    document.getElementById('stFired').textContent = stats.fired;
  }

  // ── Sound ─────────────────────────────────────────────────────────────────
  function hsBeep(level) {
    if (!sound || !aCtx) return;
    try {
      if (aCtx.state === 'suspended') aCtx.resume();
      const t = aCtx.currentTime;
      if (level === 'high') {
        [1200, 1600].forEach((freq, i) => {
          const o = aCtx.createOscillator(), g = aCtx.createGain();
          o.connect(g); g.connect(aCtx.destination);
          o.type = 'sine'; o.frequency.value = freq;
          g.gain.setValueAtTime(0.2, t + i*0.09);
          g.gain.exponentialRampToValueAtTime(0.001, t + i*0.09 + 0.25);
          o.start(t + i*0.09); o.stop(t + i*0.09 + 0.28);
        });
      } else {
        const o = aCtx.createOscillator(), g = aCtx.createGain();
        o.connect(g); g.connect(aCtx.destination);
        o.type = 'sine'; o.frequency.value = 880;
        g.gain.setValueAtTime(0.14, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        o.start(t); o.stop(t + 0.2);
      }
    } catch(e) {}
  }

  window.hsToggleSound = function() {
    sound = !sound;
    const btn = document.getElementById('btnSound');
    btn.textContent = sound ? '[S] 🔊 Sound ON' : '[S] 🔇 Sound OFF';
    btn.className   = sound ? 'hs-btn on' : 'hs-btn';
  };

  // ── Pause ─────────────────────────────────────────────────────────────────
  window.hsTogglePause = function() {
    paused = !paused;
    const btn   = document.getElementById('btnPause');
    const pulse = document.getElementById('hs-pulse');
    btn.textContent = paused ? '[P] ▶ Resume' : '[P] ⏸ Pause';
    btn.className   = paused ? 'hs-btn pause' : 'hs-btn';
    pulse.classList.toggle('paused', paused);
    document.getElementById('stStatus').textContent = paused ? 'PAUSED' : 'LIVE';
    if (!paused) hsFetch();
  };

  // ── Clear ─────────────────────────────────────────────────────────────────
  window.hsClear = function() {
    allSigs = []; stats = { high:0, med:0, today:0, fired:0 };
    hsUpdateStats();
    document.getElementById('feed-wrap').querySelectorAll('.hs-card').forEach(c => c.remove());
    const e = document.getElementById('hs-empty');
    if (e) e.style.display = 'block';
  };

  // ── Notifications ─────────────────────────────────────────────────────────
  let hsNotifsEnabled = localStorage.getItem('scanner_notifs') !== 'false';

  window.hsReqNotif = function() {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'granted') {
      // Toggle on/off without re-requesting permission
      hsNotifsEnabled = !hsNotifsEnabled;
      localStorage.setItem('scanner_notifs', hsNotifsEnabled);
      updateNotifBtn(Notification.permission);
    } else {
      // First time: request permission
      Notification.requestPermission().then(perm => {
        if (perm === 'granted') hsNotifsEnabled = true;
        updateNotifBtn(perm);
      });
    }
  };

  function updateNotifBtn(perm) {
    const btn = document.getElementById('btnNotif');
    if (!btn) return;
    const on = perm === 'granted' && hsNotifsEnabled;
    btn.textContent = on ? '[N] 🔔 Notifs ON' : '[N] 🔕 Notifs OFF';
    btn.className   = on ? 'hs-btn notif' : 'hs-btn';
  }

  function hsNotify(sig) {
    if (!('Notification' in window) || Notification.permission !== 'granted' || !hsNotifsEnabled) return;
    const n = new Notification(`🎯 TRACTOR BEAM: ${sig.symbol}`, {
      body: `${sig.pattern} — ${sig.confidence}% confidence`,
      icon: '/favicon.ico',
      tag:  `hs-${sig.id}`,
    });
    n.onclick = () => { window.focus(); n.close(); };
    setTimeout(() => n.close(), 8000);
  }

  if ('Notification' in window) updateNotifBtn(Notification.permission);

  // ── Theme / Colorblind ────────────────────────────────────────────────────
  window.hsToggleTheme = function() {
    const isLight = document.body.classList.toggle('light-mode');
    const btn = document.getElementById('btnTheme');
    btn.textContent = isLight ? '[T] ☀️ Light' : '[T] 🌙 Dark';
    btn.classList.toggle('on', isLight);
    localStorage.setItem('scanner_theme', isLight ? 'light' : 'dark');
  };

  window.hsToggleCB = function() {
    const isCB = document.body.classList.toggle('cb-mode');
    const btn = document.getElementById('btnCB');
    btn.textContent = isCB ? '[C] ✓ CB ON' : '[C] 👁 CB';
    btn.classList.toggle('on', isCB);
    localStorage.setItem('scanner_cb', isCB ? 'on' : 'off');
  };

  // Restore theme preferences on load
  (function() {
    if (localStorage.getItem('scanner_theme') === 'light') {
      document.body.classList.add('light-mode');
      const btn = document.getElementById('btnTheme');
      if (btn) { btn.textContent = '[T] ☀️ Light'; btn.classList.add('on'); }
    }
    if (localStorage.getItem('scanner_cb') === 'on') {
      document.body.classList.add('cb-mode');
      const btn = document.getElementById('btnCB');
      if (btn) { btn.textContent = '[C] ✓ CB ON'; btn.classList.add('on'); }
    }
  })();

  // ── Keyboard shortcuts ────────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
    const k = e.key.toLowerCase();
    if (k === 's') hsToggleSound();
    if (k === 'p') hsTogglePause();
    if (k === 'n') hsReqNotif();
    if (k === 't') hsToggleTheme();
    if (k === 'c') hsToggleCB();
    if (k === 'f') {
      const sel = document.getElementById('selPat');
      sel.selectedIndex = (sel.selectedIndex + 1) % sel.options.length;
      hsRerender();
    }
  });

})();
</script>
</body>
</html>
